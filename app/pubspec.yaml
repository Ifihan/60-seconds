name: sixty_seconds
description: Build speaking fluency through timed preparation and delivery.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  record: ^6.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  dio: ^5.4.3
  google_fonts: ^6.2.1
  uuid: ^4.4.2
  saver_gallery: ^3.0.6
  camera: ^0.12.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
